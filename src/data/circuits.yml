# Datos fijos de cada circuito (valen para todas las temporadas).
# La clave (melbourne, shanghai...) es la misma que `circuit` en src/data/calendar.ts.
#
#   city:    ciudad o localidad
#   length:  longitud de la vuelta en km, con punto decimal (p. ej. 5.278)
#   laps:    número de vueltas de la carrera
#   qualiRecord / raceRecord: récord de clasificación y de carrera
#     time:   '1:15.096'   (entre comillas)
#     driver: nombre del piloto
#     team:   nombre del equipo
#     season: temporada (número)
#
# Lo que dejes vacío se muestra como «—».

